name: Package offline map renderer assets (isolated)

on:
  push:
    paths:
      - .github/workflows/package-offline-map-assets.yml
      - scripts/assemble-offline-lab.py
      - scripts/check-offline-package.mjs
      - pmtiles-persistent-lab-v1.html
      - pmtiles-persistent-lab-v1.js
      - pmtiles-persistent-store-v1.js
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pin2map-offline-map-assets
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Fetch pinned application libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/vendor output/assets
          curl -fLSs --retry 3 --retry-all-errors             'https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs'             -o output/vendor/maplibre-gl.mjs
          curl -fLSs --retry 3 --retry-all-errors             'https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css'             -o output/vendor/maplibre-gl.css
          # MapLibre 6 loads a distinct ESM Web Worker at runtime.
          # The worker must be same-origin, alongside maplibre-gl.mjs.
          curl -fLSs --retry 3 --retry-all-errors \
            'https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl-worker.mjs' \
            -o output/vendor/maplibre-gl-worker.mjs
          # MapLibre 6.16.0 publishes self-contained main/worker bundles.
          # A shared chunk is not required for this pinned version.
          curl -fLSs --retry 3 --retry-all-errors             'https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js'             -o output/vendor/pmtiles.js
          curl -fLSs --retry 3 --retry-all-errors             'https://unpkg.com/@protomaps/basemaps@5.7.2/dist/basemaps.js'             -o output/vendor/basemaps.js
          for file in output/vendor/*; do test -s "$file"; done
      - name: Collect glyph ranges and sprite sheets with licenses
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/protomaps/basemaps-assets.git upstream-assets
          test -d upstream-assets/fonts
          test -s upstream-assets/sprites/v4/light.json
          test -s upstream-assets/sprites/v4/light.png
          test -s upstream-assets/sprites/v4/light@2x.json
          test -s upstream-assets/sprites/v4/light@2x.png
          cp -a upstream-assets/fonts output/assets/fonts
          mkdir -p output/assets/sprites/v4
          cp upstream-assets/sprites/v4/light* output/assets/sprites/v4/
          # Noto Sans glyphs ship with the original OFL license.
          test -s upstream-assets/fonts/OFL.txt
          test -s output/assets/fonts/OFL.txt
          # The upstream README records the sprite provenance. A separate
          # sprites/LICENSE.txt is not present in the upstream repository.
          cp upstream-assets/README.md output/assets/UPSTREAM-CREDITS.md
          git -C upstream-assets rev-parse HEAD > output/assets/upstream-basemap-assets-commit.txt
          test -s 'output/assets/fonts/Noto Sans Regular/0-255.pbf'
          test -s 'output/assets/fonts/Noto Sans Medium/0-255.pbf'
      - name: Assemble isolated offline test site and check syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/assemble-offline-lab.py
          python3 scripts/assemble-offline-lab.py
          # Ensure a valid content-addressed cache, directory offline
          # navigation and a registration limited to the lab subpath.
          python3 - <<'PY'
          from pathlib import Path
          sw=Path("output/offline-stuttgart-sw.js").read_text()
          registration=Path("output/offline-register.js").read_text()
          html=Path("output/index.html").read_text()
          assert 'const VERSION="pin2map-stuttgart-lab-' in sw
          assert 'event.request.mode==="navigate"' in sw
          assert 'cache.match("./index.html")' in sw
          assert 'url.origin!==self.location.origin' in sw
          assert '"/offline-stuttgart-lab/"' in registration
          assert "offline-stuttgart-sw.js" in registration
          assert 'https://unpkg.com' not in html
          assert 'https://protomaps.github.io' not in html
          assert ".pmtiles" not in sw
          print("Offline worker scope, navigation and local resource checks: OK")
          PY
          node --check output/pmtiles-persistent-lab-v1.js
          node --check output/pmtiles-persistent-store-v1.js
          node --check output/offline-stuttgart-sw.js
          node --check output/offline-register.js
          test -s output/manifest.json
          node scripts/check-offline-package.mjs output
          ! grep -E 'https://(unpkg.com|protomaps.github.io)' output/index.html output/pmtiles-persistent-lab-v1.js
      - name: Upload versioned resource package
        uses: actions/upload-artifact@v4
        with:
          name: pin2map-stuttgart-offline-lab-package
          path: output/
          retention-days: 14
          if-no-files-found: error

      - name: Deploy verified offline lab under isolated GitHub Pages directory
        shell: bash
        run: |
          set -euo pipefail
          # The repository Pages source is main/(root). Never touch existing
          # preview pages or the separate production pin2map repository.
          DEST="offline-stuttgart-lab"
          test "$DEST" = "offline-stuttgart-lab"
          test -s output/index.html
          test -s output/manifest.json
          test -s output/offline-stuttgart-sw.js
          test -s output/assets/fonts/OFL.txt
          test -s output/assets/sprites/v4/light.json
          # The source checkout is not assumed to be up-to-date after other
          # GitHub writers. Non-force push fails safely on concurrent changes.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch -C publish-offline-lab origin/main
          mkdir -p "$DEST"
          rsync -a --delete output/ "$DEST/"
          git add -A -- "$DEST/"
          if git diff --cached --quiet; then
            echo "Offline lab unchanged; no commit required"
          else
            git commit -m "deploy: verified isolated Stuttgart offline lab"
            git push origin HEAD:main
          fi
          {
            echo "## Offline lab publishing"
            echo
            echo "Published only to \`$DEST/\` on the Pages source branch."
            echo
            echo "URL: https://pin2map.github.io/pin2map-maplibre-preview/$DEST/"
            echo
            echo "Pages deployment and actual airplane-mode functionality remain subject to verification."
          } >> "$GITHUB_STEP_SUMMARY"
